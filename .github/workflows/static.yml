# Deploy the VEGZ static website to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Minimal permissions required by GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html is missing from the repository root."; exit 1; }
          grep -qi '<html' index.html || { echo "::error::index.html does not contain an HTML document."; exit 1; }
          grep -qi '<title>' index.html || { echo "::error::index.html is missing a page title."; exit 1; }
          grep -qi 'name="description"' index.html || { echo "::error::index.html is missing its SEO meta description."; exit 1; }
          echo "Website entry point and essential SEO metadata found."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
