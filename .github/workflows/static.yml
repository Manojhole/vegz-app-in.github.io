# Deploy the VEGZ static website to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Minimal permissions required by GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html is missing from the repository root."; exit 1; }
          grep -qi '<html' index.html || { echo "::error::index.html does not contain an HTML document."; exit 1; }
          grep -qi '<title>' index.html || { echo "::error::index.html is missing a page title."; exit 1; }
          grep -qi 'name="description"' index.html || { echo "::error::index.html is missing its SEO meta description."; exit 1; }
          test -f robots.txt || { echo "::error::robots.txt is missing."; exit 1; }
          test -f sitemap.xml || { echo "::error::sitemap.xml is missing."; exit 1; }
          test -f favicon.svg || { echo "::error::favicon.svg is missing."; exit 1; }
          grep -q 'Sitemap: https://vegz.online/sitemap.xml' robots.txt || { echo "::error::robots.txt does not point to the sitemap."; exit 1; }
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET

          html = open("index.html", encoding="utf-8").read()
          match = re.search(r'<script type="application/ld\\+json">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("::error::JSON-LD structured data is missing.")
          json.loads(match.group(1))
          sitemap = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [el.text for el in sitemap.findall("sm:url/sm:loc", ns)]
          if "https://vegz.online/" not in urls:
              raise SystemExit("::error::The canonical homepage is missing from sitemap.xml.")
          print("SEO files, JSON-LD, and sitemap XML validated.")
          PY
          echo "Website entry point and SEO essentials found."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
